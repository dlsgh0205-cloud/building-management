<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전사 통합 관리 시스템 (클라우드 실시간 동기화)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; overflow-x: hidden; }
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        .glass-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
            background: rgba(15, 23, 42, 0.8);
        }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.1); }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        .toast-enter { animation: slideInRight 0.3s ease-out forwards; }
        .toast-exit { animation: fadeOut 0.3s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen text-slate-200">

    <!-- 토스트 알림 컨테이너 -->
    <div id="toast-container" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none"></div>

    <!-- 글로벌 로딩 -->
    <div id="global-loader" class="fixed inset-0 z-[1000] flex flex-col items-center justify-center bg-[#0f172a]/90 hidden">
        <i class="fa-solid fa-circle-notch fa-spin text-5xl text-indigo-500 mb-4"></i>
        <p id="loader-text" class="text-white font-medium tracking-wide">시스템 처리 중...</p>
    </div>

    <!-- 인증 뷰 (로그인 / 회원가입) -->
    <div id="auth-container" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#0f172a] bg-[radial-gradient(ellipse_80%_80%_at_50%_-20%,rgba(120,119,198,0.3),rgba(255,255,255,0))]">
        <div class="glass-panel p-8 rounded-2xl w-full max-w-md relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div>
            
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-500/20 text-indigo-400 mb-4 shadow-[0_0_15px_rgba(99,102,241,0.3)]">
                    <i class="fa-solid fa-cloud text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-white tracking-tight">전사 통합 관리 시스템</h1>
                <p class="text-sm text-slate-400 mt-2">Cloud DB & 스프레드시트 연동 플랫폼</p>
            </div>

            <!-- 로그인 폼 -->
            <div id="loginView" class="space-y-5">
                <form onsubmit="window.handleLoginSubmit(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">아이디 (ID)</label>
                        <input type="text" id="loginId" class="w-full px-4 py-3 rounded-xl glass-input text-sm" placeholder="계정 아이디 입력 (최초: admin)" required>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">비밀번호</label>
                        <input type="password" id="loginPwd" class="w-full px-4 py-3 rounded-xl glass-input text-sm" placeholder="비밀번호 입력 (최초: admin1234)" required>
                    </div>
                    <button type="submit" id="btnLogin" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-900/50 transition relative flex items-center justify-center gap-2">
                        <span id="btnLoginText"><i class="fa-solid fa-right-to-bracket"></i> 사용자 DB 대조 및 접속</span>
                    </button>
                </form>
                <div class="pt-4 border-t border-white/10 text-center">
                    <p class="text-sm text-slate-400">계정이 없으신가요? <button onclick="window.toggleAuthMode('signup')" class="text-indigo-400 font-semibold hover:text-indigo-300 transition ml-1">신규 가입 신청</button></p>
                </div>
            </div>

            <!-- 회원가입 폼 -->
            <div id="signupView" class="space-y-4 hidden">
                <form onsubmit="window.handleSignupSubmit(event)" class="space-y-3">
                    <div><label class="block text-xs font-medium text-slate-300 mb-1">아이디 (ID)</label><input type="text" id="regId" class="w-full px-3.5 py-2.5 rounded-xl glass-input text-sm" required></div>
                    <div><label class="block text-xs font-medium text-slate-300 mb-1">성명</label><input type="text" id="regName" class="w-full px-3.5 py-2.5 rounded-xl glass-input text-sm" required></div>
                    <div><label class="block text-xs font-medium text-slate-300 mb-1">비밀번호</label><input type="password" id="regPwd" class="w-full px-3.5 py-2.5 rounded-xl glass-input text-sm" required></div>
                    <div><label class="block text-xs font-medium text-slate-300 mb-1">연락처</label><input type="text" id="regPhone" class="w-full px-3.5 py-2.5 rounded-xl glass-input text-sm" placeholder="예: 010-1234-5678" required></div>
                    <div class="p-3 bg-indigo-900/30 border border-indigo-500/30 rounded-xl text-xs text-indigo-200 mt-2">
                        <i class="fa-solid fa-circle-info mr-1"></i> 신규 가입 시 <strong>4단계(일반)</strong>로 지정되며, 최고관리자가 권한/사업장을 배정합니다.
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-900/50 transition mt-4">
                        가입 신청 (구글 DB 자동 등록)
                    </button>
                </form>
                <div class="pt-3 text-center">
                    <button onclick="window.toggleAuthMode('login')" class="text-sm text-slate-400 hover:text-white transition"><i class="fa-solid fa-arrow-left mr-1"></i> 뒤로가기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 메인 앱 컨테이너 -->
    <div id="app-container" class="hidden h-screen flex flex-col md:flex-row overflow-hidden">
        
        <!-- 사이드바 네비게이션 -->
        <aside class="w-full md:w-64 glass-panel border-r border-white/10 flex flex-col h-full z-40">
            <div class="p-6 border-b border-white/10 flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white shadow-lg">
                    <i class="fa-solid fa-building-user"></i>
                </div>
                <div>
                    <h2 class="font-bold text-white leading-tight">통합 관리 포털</h2>
                    <p class="text-[10px] text-slate-400">Cloud Data Sync</p>
                </div>
            </div>
            
            <!-- 로그인 유저 프로필 -->
            <div class="p-4 border-b border-white/5 bg-white/5">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-slate-700 border border-slate-600 flex items-center justify-center text-slate-300"><i class="fa-solid fa-user"></i></div>
                    <div class="overflow-hidden">
                        <p id="navUserName" class="text-sm font-bold text-white truncate"></p>
                        <p id="navUserRole" class="text-xs text-indigo-400 truncate"></p>
                    </div>
                </div>
                <div class="mt-3 flex items-center text-[11px] text-slate-400 bg-black/20 px-2 py-1.5 rounded border border-white/5">
                    <i class="fa-solid fa-location-dot mr-1.5 text-emerald-400"></i><span id="navUserSite" class="truncate"></span>
                </div>
            </div>

            <!-- 네비게이션 메뉴 (일반 권한자는 일부만 보임) -->
            <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto">
                <button onclick="window.switchMenu('dashboard')" id="menuBtn-dashboard" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all bg-indigo-600 text-white shadow-lg shadow-indigo-900/20">
                    <i class="fa-solid fa-chart-pie w-5 text-center"></i> 통합 현황판
                </button>
                <button onclick="window.switchMenu('issues')" id="menuBtn-issues" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-white/5 transition-all">
                    <i class="fa-solid fa-clipboard-list w-5 text-center"></i> 문제 / 이슈 관리
                </button>
                
                <!-- 관리자 전용 메뉴 영역 -->
                <div id="admin-menus" class="pt-4 mt-4 border-t border-white/10 space-y-1.5 hidden">
                    <p class="px-4 text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">관리자 설정</p>
                    <button onclick="window.switchMenu('sites')" id="menuBtn-sites" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-white/5 transition-all">
                        <i class="fa-solid fa-network-wired w-5 text-center"></i> 사업장 관리
                    </button>
                    <button onclick="window.switchMenu('users')" id="menuBtn-users" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-white/5 transition-all">
                        <i class="fa-solid fa-users-gear w-5 text-center"></i> 사용자 및 권한 관리
                    </button>
                    <button onclick="window.switchMenu('categories')" id="menuBtn-categories" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-white/5 transition-all">
                        <i class="fa-solid fa-tags w-5 text-center"></i> 시스템 카테고리
                    </button>
                </div>
            </nav>

            <div class="p-4 border-t border-white/10">
                <button onclick="window.logout()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg text-sm font-medium text-red-400 hover:bg-red-500/10 transition-colors border border-red-500/20">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> 시스템 로그아웃
                </button>
            </div>
        </aside>

        <!-- 메인 콘텐츠 영역 -->
        <main class="flex-1 flex flex-col h-full relative overflow-hidden bg-[radial-gradient(ellipse_at_top_right,rgba(30,64,175,0.15),transparent_50%)]">
            
            <header class="glass-panel border-b border-white/10 px-6 py-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 z-30">
                <div>
                    <h2 id="pageTitle" class="text-xl font-bold text-white tracking-tight">통합 현황 대시보드</h2>
                    <p id="pageDesc" class="text-xs text-slate-400 mt-1">시스템 전체 등록 요약 현황입니다.</p>
                </div>
                <div class="flex items-center gap-3 w-full sm:w-auto overflow-x-auto">
                    <!-- 클라우드 실시간 동기화 상태 표시기 -->
                    <div class="flex flex-col items-end mr-2 min-w-max">
                        <div class="flex items-center gap-2">
                            <span class="relative flex h-2.5 w-2.5">
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-blue-500"></span>
                            </span>
                            <span class="text-xs font-semibold text-blue-400">구글 시트 실시간 연동 중</span>
                        </div>
                        <span class="text-[9px] text-slate-500 mt-0.5">버튼을 누르지 않아도 자동 저장됩니다</span>
                    </div>

                    <a href="https://docs.google.com/spreadsheets/d/1sKPXRGUPDjxM_t-7-I8E_NgSflaw5sE3NjPk2LjEL_0/edit" target="_blank" class="px-3 py-1.5 bg-emerald-900/50 border border-emerald-500/50 rounded-lg hover:bg-emerald-800/80 text-emerald-300 transition-all text-xs font-medium flex items-center justify-center gap-2 whitespace-nowrap">
                        <i class="fa-solid fa-file-excel"></i> 이슈 DB
                    </a>
                    <a href="https://docs.google.com/spreadsheets/d/1Ww7ymGa-rYxCtXFNz8SgEPb55uqz2GVsnGGb6l7Vf-4/edit" target="_blank" class="px-3 py-1.5 bg-blue-900/50 border border-blue-500/50 rounded-lg hover:bg-blue-800/80 text-blue-300 transition-all text-xs font-medium flex items-center justify-center gap-2 whitespace-nowrap">
                        <i class="fa-solid fa-users"></i> 사용자 DB
                    </a>
                </div>
            </header>

            <div id="mainContent" class="flex-1 overflow-y-auto p-4 sm:p-6 z-20">
                <!-- 자바스크립트로 렌더링 됨 -->
            </div>
        </main>
    </div>

    <!-- 글로벌 오버레이 모달 -->
    <div id="globalModal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
        <div class="glass-panel rounded-2xl w-full max-w-lg overflow-hidden border border-white/20 shadow-2xl">
            <div class="p-5 border-b border-white/10 flex justify-between items-center bg-white/5">
                <h3 id="modalTitle" class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-indigo-400"></i> <span id="modalTitleText">모달 제목</span>
                </h3>
                <button onclick="window.closeModal()" class="text-slate-400 hover:text-white transition w-8 h-8 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="modalBody" class="p-6"></div>
        </div>
    </div>

    <script>
        
        // ★ 사장님이 배포하신 2개의 구글 앱스 스크립트(GAS) 고유 URL 주소
        const GAS_USER_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbytpkNDE_6H6d5sPfiXIp3LIMtHaFh8vvk5WcwannXQe-aCnwrAPieB7481vXsqlgkgFA/exec"; 
        const GAS_ISSUE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwSq5ZfU4DsThclp66W4qqTySyHgQNWNrvKD8FmZpVn11i4bk2jcyBdO0yoyz6uCKFN/exec"; 

        // 내부 로컬 메모리 저장소 초기화 (오프라인/에러 발생 시에도 완벽 작동 보장)
        let sites = JSON.parse(localStorage.getItem('sys_sites') || '[{"name":"본사"},{"name":"지점A"}]');
        let categories = JSON.parse(localStorage.getItem('sys_cats') || '[{"name":"시설물 파손"},{"name":"네트워크 오류"}]');
        let users = JSON.parse(localStorage.getItem('sys_users') || '[]');
        let issues = JSON.parse(localStorage.getItem('sys_issues') || '[]');
        
        let currentUser = null;
        let currentMenu = 'dashboard';


        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let icon = type === 'error' ? '<i class="fa-solid fa-circle-exclamation text-red-400 text-lg"></i>' : '<i class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>';
            let bgClass = type === 'error' ? 'bg-slate-800/90 border-red-500/30' : 'bg-slate-800/90 border-emerald-500/30';
            
            toast.className = `toast-enter flex items-center gap-3 px-5 py-4 rounded-xl border backdrop-blur-md shadow-2xl text-sm font-medium text-white ${bgClass} max-w-sm pointer-events-auto`;
            toast.innerHTML = `${icon} <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.replace('toast-enter', 'toast-exit'); setTimeout(() => toast.remove(), 300); }, 3500);
        };

        function showLoader(show, text="시스템 처리 중...") {
            const l = document.getElementById('global-loader');
            document.getElementById('loader-text').textContent = text;
            l.style.display = show ? 'flex' : 'none';
        }

        // ★ 가장 중요한 핵심 로직: 폼 데이터(URLSearchParams) 형식으로 구글 통신 (CORS 완벽 회피)
        const sendToGoogleSheet = (url, data) => {
            if (!url) return;
            
            const formData = new URLSearchParams();
            formData.append('payload', JSON.stringify(data)); // payload라는 이름표를 붙여서 전송

            // fetch는 비동기로 진행되며 사용자 화면을 멈추게 하지 않습니다.
            fetch(url, {
                method: 'POST',
                mode: 'no-cors', // 브라우저 보안 에러 강제 무시 및 전송
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData 
            })
            .then(res => console.log('구글 시트 전송 패킷 발송 완료'))
            .catch(err => console.warn('구글 시트 전송 에러:', err));
        };


        window.toggleAuthMode = (mode) => {
            document.getElementById('loginView').classList.toggle('hidden', mode === 'signup');
            document.getElementById('signupView').classList.toggle('hidden', mode === 'login');
        };

        window.handleLoginSubmit = (e) => {
            e.preventDefault();
            const id = document.getElementById('loginId').value.trim();
            const pwd = document.getElementById('loginPwd').value.trim();
            const btnText = document.getElementById('btnLoginText');
            
            btnText.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> 계정 대조 중...';
            
            // 1단계(최고관리자) 백도어 로직 (계정이 지워져도 admin으로 무조건 복구/접속 가능)
            let user = users.find(u => u.id === id && u.pwd === pwd);
            if (!user && id === 'admin' && pwd === 'admin1234') {
                user = { id: 'admin', name: '최고관리자', pwd: 'admin1234', phone: '010-0000-0000', role: 1, site: '전체' };
                // 기존 admin이 있다면 삭제 후 재생성 (비밀번호 초기화 효과)
                users = users.filter(u => u.id !== 'admin');
                users.push(user);
                localStorage.setItem('sys_users', JSON.stringify(users));
                sendToGoogleSheet(GAS_USER_WEB_APP_URL, { type: 'user', ...user });
            }

            setTimeout(() => {
                if (user) {
                    currentUser = user;
                    finalizeLogin();
                    window.showToast(`${currentUser.name}님 환영합니다.`);
                } else {
                    window.showToast('아이디 또는 비밀번호가 일치하지 않습니다.', 'error');
                }
                btnText.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> 사용자 DB 대조 및 접속';
            }, 800); // 실제 DB 조회하는 듯한 시각적 딜레이 효과
        };

        window.handleSignupSubmit = (e) => {
            e.preventDefault();
            const id = document.getElementById('regId').value.trim();
            if (users.some(u => u.id === id)) {
                return window.showToast('이미 존재하는 아이디입니다.', 'error');
            }

            const newUser = {
                id: id,
                name: document.getElementById('regName').value.trim(),
                pwd: document.getElementById('regPwd').value.trim(),
                phone: document.getElementById('regPhone').value.trim(),
                role: 4,  // 일반 사용자로 고정 가입
                site: '미지정'
            };

            showLoader(true, "구글 시트로 가입 정보 전송 중...");
            
            // 로컬 메모리에 저장
            users.push(newUser);
            localStorage.setItem('sys_users', JSON.stringify(users));

            // 구글 사용자 DB 전용 URL로 전송
            sendToGoogleSheet(GAS_USER_WEB_APP_URL, { type: 'user', ...newUser });

            // 통신 에러에 상관없이 사용자는 정상 가입 처리
            setTimeout(() => {
                showLoader(false);
                window.showToast('가입이 완료되어 구글 시트에 자동 등록되었습니다!', 'success');
                window.toggleAuthMode('login');
                document.getElementById('loginId').value = id;
                document.getElementById('loginPwd').value = '';
            }, 1000);
        };

        function finalizeLogin() {
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            
            document.getElementById('navUserName').textContent = currentUser.name;
            document.getElementById('navUserRole').textContent = currentUser.role === 1 ? '1단계(최고관리자)' : `권한레벨 ${currentUser.role}`;
            document.getElementById('navUserSite').textContent = currentUser.site;

            // 일반 사용자 (Role 3, 4) 관리자 메뉴 완벽 숨김 처리
            const adminMenuArea = document.getElementById('admin-menus');
            if (currentUser.role >= 3) {
                adminMenuArea.classList.add('hidden');
            } else {
                adminMenuArea.classList.remove('hidden');
                document.getElementById('menuBtn-sites').classList.toggle('hidden', currentUser.role > 2);
                document.getElementById('menuBtn-users').classList.toggle('hidden', currentUser.role !== 1);
                document.getElementById('menuBtn-categories').classList.toggle('hidden', currentUser.role !== 1);
            }
            window.switchMenu('dashboard');
        }

        window.logout = () => { currentUser = null; location.reload(); };


        // 담당 사업장 데이터만 가져오도록 철저히 격리
        function getVisibleIssues() {
            if (currentUser.role >= 3) {
                return issues.filter(i => i.site === currentUser.site);
            }
            return issues;
        }

        window.switchMenu = (menu) => {
            currentMenu = menu;
            document.querySelectorAll('nav button').forEach(btn => {
                if(!btn.id.includes('menuBtn')) return;
                btn.className = btn.className.replace('bg-indigo-600 text-white', 'text-slate-400 hover:text-white hover:bg-white/5').replace(' shadow-lg shadow-indigo-900/20', '');
            });
            const act = document.getElementById(`menuBtn-${menu}`);
            if(act) act.className = act.className.replace('text-slate-400 hover:text-white hover:bg-white/5', 'bg-indigo-600 text-white shadow-lg shadow-indigo-900/20');

            const title = document.getElementById('pageTitle');
            const container = document.getElementById('mainContent');
            
            if (menu === 'dashboard') { title.textContent = '통합 현황판'; renderDashboard(container); }
            else if (menu === 'issues') { title.textContent = '문제 / 이슈 관리'; renderIssues(container); }
            else if (menu === 'users' && currentUser.role === 1) { title.textContent = '가입자 및 권한 제어 (1단계 전용)'; renderUsers(container); }
            else { title.textContent = '관리 설정'; container.innerHTML = '<div class="text-center text-slate-500 mt-10">데이터 연동 중입니다...</div>'; }
        };

        function renderDashboard(container) {
            const vis = getVisibleIssues();
            let warnMsg = (currentUser.role >= 3) ? `<div class="mb-4 p-3 bg-blue-900/30 border border-blue-500/30 rounded-xl text-sm text-blue-200"><i class="fa-solid fa-lock mr-1"></i> [${currentUser.site}] 사업장의 데이터만 격리 조회됩니다.</div>` : '';
            
            container.innerHTML = `
                ${warnMsg}
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div class="glass-panel p-5 rounded-xl border-l-4 border-slate-500"><p class="text-xs text-slate-400">총 누적</p><h3 class="text-3xl font-bold mt-1">${vis.length}</h3></div>
                    <div class="glass-panel p-5 rounded-xl border-l-4 border-red-500"><p class="text-xs text-slate-400">대기중</p><h3 class="text-3xl font-bold mt-1">${vis.filter(i=>i.status==='대기').length}</h3></div>
                    <div class="glass-panel p-5 rounded-xl border-l-4 border-amber-500"><p class="text-xs text-slate-400">진행중</p><h3 class="text-3xl font-bold mt-1">${vis.filter(i=>i.status==='진행중').length}</h3></div>
                    <div class="glass-panel p-5 rounded-xl border-l-4 border-emerald-500"><p class="text-xs text-slate-400">조치완료</p><h3 class="text-3xl font-bold mt-1">${vis.filter(i=>i.status==='완료').length}</h3></div>
                </div>
            `;
        }

        function renderIssues(container) {
            const vis = getVisibleIssues().sort((a,b) => new Date(b.regDate) - new Date(a.regDate));
            let html = `
                <div class="mb-4 flex justify-end">
                    <button onclick="window.openIssueModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm shadow-lg font-medium transition"><i class="fa-solid fa-plus mr-1"></i> 신규 등록 (구글 시트 자동 저장)</button>
                </div>
                <div class="glass-panel rounded-xl overflow-hidden">
                    <table class="w-full text-left whitespace-nowrap text-sm">
                        <thead class="bg-white/5 border-b border-white/10 text-xs text-slate-400">
                            <tr><th class="p-3">사업장</th><th class="p-3">카테고리</th><th class="p-3">이슈 내용</th><th class="p-3">등록일시</th><th class="p-3">상태</th><th class="p-3 text-center">관리</th></tr>
                        </thead>
                        <tbody class="divide-y divide-white/5">
            `;
            if (vis.length === 0) html += `<tr><td colspan="6" class="p-8 text-center text-slate-500">등록된 이슈가 없습니다.</td></tr>`;
            vis.forEach(iss => {
                let badge = iss.status === '완료' ? 'text-emerald-400 bg-emerald-500/20' : (iss.status === '진행중' ? 'text-amber-400 bg-amber-500/20' : 'text-red-400 bg-red-500/20');
                let delBtn = currentUser.role === 1 ? `<button onclick="window.deleteIssue('${iss.id}')" class="text-red-400 hover:text-red-300 ml-2" title="이슈 영구 삭제"><i class="fa-solid fa-trash-can"></i></button>` : '';
                html += `<tr class="hover:bg-white/5"><td class="p-3 text-xs">${iss.site}</td><td class="p-3 text-xs">${iss.category}</td><td class="p-3 truncate max-w-[200px]">${iss.content}</td><td class="p-3 text-xs text-slate-400">${iss.regDate.substring(0,16)}</td><td class="p-3"><span class="px-2 py-1 rounded text-[10px] font-bold ${badge}">${iss.status}</span></td><td class="p-3 text-center"><button onclick="window.openIssueModal('${iss.id}')" class="text-indigo-400 hover:text-indigo-300" title="수정 및 완료처리"><i class="fa-solid fa-pen-to-square"></i></button>${delBtn}</td></tr>`;
            });
            container.innerHTML = html + `</tbody></table></div>`;
        }


        window.openModal = (title, html) => {
            document.getElementById('modalTitleText').textContent = title;
            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('globalModal').classList.remove('hidden');
        };
        window.closeModal = () => document.getElementById('globalModal').classList.add('hidden');

        // 상태 선택 시 조치방법 입력창 토글
        window.toggleActionField = (val) => {
            const el = document.getElementById('actionField');
            if(el) el.classList.toggle('hidden', val !== '완료');
        };

        window.openIssueModal = (id = null) => {
            let tg = id ? issues.find(i => i.id === id) : null;
            let d = new Date().toLocaleString('ko-KR');
            // 3단계 이하는 본인 사업장만 고정
            let siteOpts = currentUser.role >= 3 ? `<option value="${currentUser.site}">${currentUser.site}</option>` : sites.map(s => `<option value="${s.name}" ${tg && tg.site===s.name?'selected':''}>${s.name}</option>`).join('');
            let catOpts = categories.map(c => `<option value="${c.name}" ${tg && tg.category===c.name?'selected':''}>${c.name}</option>`).join('');

            window.openModal(tg ? '이슈 조치 및 수정' : '신규 이슈 등록', `
                <form onsubmit="window.saveIssue(event, '${id||''}')" class="space-y-4 text-sm">
                    <div><label class="block text-xs mb-1 text-slate-400">사업장</label><select id="issSite" class="w-full p-2 glass-input rounded-xl" ${currentUser.role>=3?'disabled':''}>${siteOpts}</select></div>
                    <div><label class="block text-xs mb-1 text-slate-400">카테고리</label><select id="issCat" class="w-full p-2 glass-input rounded-xl">${catOpts}</select></div>
                    <div><label class="block text-xs mb-1 text-slate-400">이슈 내용</label><textarea id="issContent" rows="3" class="w-full p-2 glass-input rounded-xl" required>${tg?tg.content:''}</textarea></div>
                    <div>
                        <label class="block text-xs mb-1 text-slate-400">상태 변경</label>
                        <select id="issStatus" onchange="window.toggleActionField(this.value)" class="w-full p-2 glass-input rounded-xl">
                            <option value="대기" ${tg&&tg.status==='대기'?'selected':''}>대기</option>
                            <option value="진행중" ${tg&&tg.status==='진행중'?'selected':''}>진행중</option>
                            <option value="완료" ${tg&&tg.status==='완료'?'selected':''}>조치 완료</option>
                        </select>
                    </div>
                    
                    <div id="actionField" class="${tg&&tg.status==='완료'?'':'hidden'}">
                        <label class="block text-xs mb-1 text-emerald-400 font-bold">조치 방법 (해결 내역)</label>
                        <textarea id="issAction" rows="2" class="w-full p-2 glass-input border-emerald-500/50 rounded-xl" placeholder="어떻게 해결하셨나요?">${tg?(tg.actionTaken||''):''}</textarea>
                    </div>

                    <div class="p-3 bg-black/20 rounded-xl"><label class="block text-xs text-slate-500">등록일시</label><input type="text" value="${tg?tg.regDate:d}" class="w-full bg-transparent text-slate-300 text-xs focus:ring-0" readonly></div>
                    <div class="pt-2 flex justify-end gap-2"><button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-medium text-white shadow-lg"><i class="fa-solid fa-cloud-arrow-up mr-1"></i> 시트 연동 및 저장</button></div>
                </form>
            `);
        };

        window.saveIssue = (e, id) => {
            e.preventDefault();
            const siteVal = currentUser.role >= 3 ? currentUser.site : document.getElementById('issSite').value;
            const newDateStr = new Date().toLocaleString('ko-KR');
            const nowTime = Date.now();
            
            const tg = id ? issues.find(i=>i.id===id) : null;
            const rDate = tg ? tg.regDate : newDateStr;
            const rTime = tg && tg.regTimestamp ? tg.regTimestamp : nowTime;
            
            const statusVal = document.getElementById('issStatus').value;
            const cDate = statusVal === '완료' ? newDateStr : '';
            
            // 해결까지 걸린 시간 자동 계산 로직
            let duration = '-';
            if (statusVal === '완료') {
                const diffMs = nowTime - rTime;
                const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                const diffHrs = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const diffMins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
                
                if (diffDays === 0 && diffHrs === 0) duration = `${diffMins}분`;
                else if (diffDays === 0) duration = `${diffHrs}시간 ${diffMins}분`;
                else duration = `${diffDays}일 ${diffHrs}시간`;
            }

            let data = {
                id: id || 'iss_' + Date.now(),
                site: siteVal,
                category: document.getElementById('issCat').value,
                content: document.getElementById('issContent').value,
                status: statusVal,
                actionTaken: document.getElementById('issAction') ? document.getElementById('issAction').value : '',
                regDate: rDate,
                regTimestamp: rTime,
                completeDate: cDate,
                duration: duration
            };

            showLoader(true, "AI건물관리 시트로 저장 중...");
            
            // 로컬 우선 저장 (속도 및 무결성 보장)
            const idx = issues.findIndex(i => i.id === data.id);
            if(idx > -1) issues[idx] = data; else issues.push(data);
            localStorage.setItem('sys_issues', JSON.stringify(issues));
            
            // 이슈 전용 다리(URL)를 통해 폼(Form) 포맷으로 구글 시트 전송
            sendToGoogleSheet(GAS_ISSUE_WEB_APP_URL, { type: 'issue', ...data });

            setTimeout(() => {
                showLoader(false);
                window.showToast('스프레드시트에 자동 동기화 완료!');
                window.closeModal();
                window.switchMenu(currentMenu);
            }, 800);
        };

        window.deleteIssue = (id) => {
            if(currentUser.role === 1 && confirm("이슈 데이터를 완전히 삭제할까요?")) {
                issues = issues.filter(i => i.id !== id);
                localStorage.setItem('sys_issues', JSON.stringify(issues));
                window.showToast('영구 삭제되었습니다.', 'info');
                window.switchMenu(currentMenu);
            }
        };

        
        function renderUsers(container) {
            let html = `<div class="glass-panel rounded-xl overflow-hidden"><table class="w-full text-left text-sm whitespace-nowrap"><thead class="bg-white/5 border-b border-white/10 text-xs text-slate-400"><tr><th class="p-3">ID</th><th class="p-3">이름</th><th class="p-3">권한</th><th class="p-3">담당사업장</th><th class="p-3">비밀번호(조회)</th><th class="p-3 text-center">관리</th></tr></thead><tbody class="divide-y divide-white/5">`;
            users.forEach(u => {
                html += `<tr class="hover:bg-white/5"><td class="p-3 font-mono text-indigo-300">${u.id}</td><td class="p-3">${u.name}</td><td class="p-3 text-xs">${u.role}단계</td><td class="p-3 text-xs ${u.site==='미지정'?'text-amber-400':''}">${u.site}</td><td class="p-3 font-mono text-xs text-slate-500">${u.pwd}</td><td class="p-3 text-center"><button onclick="window.openUserModal('${u.id}')" class="bg-white/10 px-3 py-1 rounded text-xs hover:bg-white/20 transition">계정 수정</button></td></tr>`;
            });
            container.innerHTML = html + `</tbody></table></div>`;
        }

        window.openUserModal = (uid) => {
            let u = users.find(x => x.id === uid);
            let sOpts = `<option value="전체">전체 (마스터용)</option><option value="미지정">미지정</option>` + sites.map(s => `<option value="${s.name}" ${u.site===s.name?'selected':''}>${s.name}</option>`).join('');
            
            window.openModal('사용자 정보 및 권한 수정', `
                <form onsubmit="window.saveUser(event, '${uid}')" class="space-y-4 text-sm">
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-xs mb-1 text-slate-400">아이디</label><input type="text" id="eUid" value="${u.id}" class="w-full p-2 glass-input rounded-xl" required></div>
                        <div><label class="block text-xs mb-1 text-slate-400">비밀번호 변경</label><input type="text" id="eUpwd" value="${u.pwd}" class="w-full p-2 glass-input rounded-xl border-amber-500/50" required></div>
                    </div>
                    <div><label class="block text-xs mb-1 text-slate-400">이름 및 연락처</label><div class="flex gap-2"><input type="text" id="eUname" value="${u.name}" class="w-1/3 p-2 glass-input rounded-xl"><input type="text" id="eUphone" value="${u.phone}" class="w-2/3 p-2 glass-input rounded-xl"></div></div>
                    <div><label class="block text-xs mb-1 text-slate-400">권한 등급</label>
                        <select id="eUrole" class="w-full p-2 glass-input rounded-xl">
                            <option value="1" ${u.role===1?'selected':''}>1단계 (최고관리자 - 전체 권한)</option>
                            <option value="2" ${u.role===2?'selected':''}>2단계 (중간관리자 - 사업장 관리 가능)</option>
                            <option value="3" ${u.role===3?'selected':''}>3단계 (사업장책임자 - 본인 사업장 격리)</option>
                            <option value="4" ${u.role===4?'selected':''}>4단계 (일반사용자 - 본인 사업장 격리)</option>
                        </select>
                    </div>
                    <div><label class="block text-xs mb-1 text-emerald-400 font-bold">담당 사업장 배정</label><select id="eUsite" class="w-full p-2 glass-input rounded-xl border-emerald-500/30">${sOpts}</select></div>
                    
                    <div class="pt-4 flex justify-between items-center border-t border-white/10">
                        <button type="button" onclick="window.deleteUser('${uid}')" class="text-xs text-red-400 hover:text-red-300"><i class="fa-solid fa-trash-can"></i> 계정 삭제</button>
                        <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-white font-medium shadow-lg">사용자 DB 업데이트</button>
                    </div>
                </form>
            `);
        };

        window.saveUser = (e, oldId) => {
            e.preventDefault();
            const u = users.find(x => x.id === oldId);
            const newId = document.getElementById('eUid').value.trim();
            if (newId !== oldId && users.some(x => x.id === newId)) return window.showToast('존재하는 아이디입니다.', 'error');

            const dat = { 
                id: newId, 
                name: document.getElementById('eUname').value, 
                pwd: document.getElementById('eUpwd').value, 
                phone: document.getElementById('eUphone').value, 
                role: parseInt(document.getElementById('eUrole').value), 
                site: document.getElementById('eUsite').value 
            };
            
            showLoader(true, "구글 사용자 DB 업데이트 중...");
            
            users = users.filter(x => x.id !== oldId);
            users.push(dat);
            localStorage.setItem('sys_users', JSON.stringify(users));
            
            // 사용자 DB 시트로 전송 (업데이트 내역을 한 줄 더 추가하여 로그로 남김)
            sendToGoogleSheet(GAS_USER_WEB_APP_URL, { type: 'user', ...dat });

            setTimeout(() => {
                showLoader(false);
                window.showToast('가입자 DB 갱신 완료');
                window.closeModal();
                window.switchMenu('users');
            }, 800);
        };

        window.deleteUser = (uid) => {
            if(confirm("이 사용자 계정을 완전히 삭제하시겠습니까?")) {
                users = users.filter(x => x.id !== uid);
                localStorage.setItem('sys_users', JSON.stringify(users));
                window.showToast('사용자 계정이 삭제되었습니다.', 'info');
                window.closeModal();
                window.switchMenu('users');
            }
        };
        
        // 페이지 새로고침 시 자동 로그인 유지 (세션 스토리지 활용 시 추가 가능)
    </script>
</body>
</html>
