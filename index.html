<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전사 통합 관리 시스템 (클라우드 연동)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; overflow-x: hidden; }
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        .glass-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
            background: rgba(15, 23, 42, 0.8);
        }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.1); }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        .toast-enter { animation: slideInRight 0.3s ease-out forwards; }
        .toast-exit { animation: fadeOut 0.3s ease-out forwards; }
        
        /* 로딩 스피너 */
        #global-loader { backdrop-filter: blur(5px); }
    </style>
</head>
<body class="min-h-screen text-slate-200">

    <!-- 토스트 알림 컨테이너 -->
    <div id="toast-container" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none"></div>

    <!-- 글로벌 로딩 -->
    <div id="global-loader" class="fixed inset-0 z-[1000] flex flex-col items-center justify-center bg-[#0f172a]/80 hidden">
        <i class="fa-solid fa-circle-notch fa-spin text-5xl text-indigo-500 mb-4"></i>
        <p class="text-white font-medium tracking-wide">클라우드 데이터 동기화 중...</p>
    </div>

    <!-- 인증 뷰 (로그인 / 회원가입) -->
    <div id="auth-container" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#0f172a] bg-[radial-gradient(ellipse_80%_80%_at_50%_-20%,rgba(120,119,198,0.3),rgba(255,255,255,0))]">
        <div class="glass-panel p-8 rounded-2xl w-full max-w-md relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div>
            
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-500/20 text-indigo-400 mb-4 shadow-[0_0_15px_rgba(99,102,241,0.3)]">
                    <i class="fa-solid fa-cloud text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-white tracking-tight">전사 통합 관리 시스템</h1>
                <p class="text-sm text-slate-400 mt-2">실시간 클라우드 동기화 플랫폼</p>
            </div>

            <!-- 로그인 폼 -->
            <div id="loginView" class="space-y-5">
                <form onsubmit="window.handleLoginSubmit(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">아이디 (ID)</label>
                        <input type="text" id="loginId" class="w-full px-4 py-3 rounded-xl glass-input text-sm" placeholder="계정 아이디 입력" required>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">비밀번호</label>
                        <input type="password" id="loginPwd" class="w-full px-4 py-3 rounded-xl glass-input text-sm" placeholder="비밀번호 입력" required>
                    </div>
                    <button type="submit" id="btnLogin" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-900/50 transition relative flex items-center justify-center gap-2">
                        <span id="btnLoginText"><i class="fa-solid fa-right-to-bracket"></i> 시스템 접속 (DB 검증)</span>
                    </button>
                </form>
                <div class="pt-4 border-t border-white/10 text-center">
                    <p class="text-sm text-slate-400">계정이 없으신가요? <button onclick="window.toggleAuthMode('signup')" class="text-indigo-400 font-semibold hover:text-indigo-300 transition ml-1">신규 가입 신청</button></p>
                </div>
            </div>

            <!-- 회원가입 폼 -->
            <div id="signupView" class="space-y-4 hidden">
                <form onsubmit="window.handleSignupSubmit(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">아이디 (ID)</label>
                        <input type="text" id="regId" class="w-full px-3.5 py-2.5 rounded-xl glass-input text-sm" placeholder="사용할 아이디 입력" required>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">성명</label>
                        <input type="text" id="regName" class="w-full px-3.5 py-2.5 rounded-xl glass-input text-sm" placeholder="실명 입력" required>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">비밀번호</label>
                        <input type="password" id="regPwd" class="w-full px-3.5 py-2.5 rounded-xl glass-input text-sm" placeholder="비밀번호 입력" required>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">연락처</label>
                        <input type="text" id="regPhone" class="w-full px-3.5 py-2.5 rounded-xl glass-input text-sm" placeholder="예: 010-1234-5678" required>
                    </div>
                    <div class="p-3 bg-indigo-900/30 border border-indigo-500/30 rounded-xl text-xs text-indigo-200 mt-2 leading-relaxed">
                        <i class="fa-solid fa-circle-info mr-1"></i> 신규 가입 시 <strong>일반 사용자</strong> 권한이 부여되며, 가입 후 <strong>1단계 최고관리자</strong>가 담당 사업장을 직접 배정합니다.
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-900/50 transition mt-4">
                        <i class="fa-solid fa-user-plus mr-1"></i> 가입 신청 및 실시간 동기화
                    </button>
                </form>
                <div class="pt-3 text-center">
                    <button onclick="window.toggleAuthMode('login')" class="text-sm text-slate-400 hover:text-white transition"><i class="fa-solid fa-arrow-left mr-1"></i> 로그인 화면으로 돌아가기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 메인 앱 컨테이너 -->
    <div id="app-container" class="hidden h-screen flex flex-col md:flex-row overflow-hidden">
        
        <!-- 사이드바 네비게이션 -->
        <aside class="w-full md:w-64 glass-panel border-r border-white/10 flex flex-col h-full z-40">
            <div class="p-6 border-b border-white/10 flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white shadow-lg">
                    <i class="fa-solid fa-building-user"></i>
                </div>
                <div>
                    <h2 class="font-bold text-white leading-tight">통합 관리 시스템</h2>
                    <p class="text-[10px] text-slate-400">Cloud Sync Portal</p>
                </div>
            </div>
            
            <div class="p-4 border-b border-white/5 bg-white/5">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-slate-700 border border-slate-600 flex items-center justify-center text-slate-300">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="overflow-hidden">
                        <p id="navUserName" class="text-sm font-bold text-white truncate"></p>
                        <p id="navUserRole" class="text-xs text-indigo-400 truncate"></p>
                    </div>
                </div>
                <div class="mt-3 flex items-center text-[11px] text-slate-400 bg-black/20 px-2 py-1.5 rounded border border-white/5">
                    <i class="fa-solid fa-location-dot mr-1.5 text-emerald-400"></i>
                    <span id="navUserSite" class="truncate"></span>
                </div>
            </div>

            <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto">
                <button onclick="window.switchMenu('dashboard')" id="menuBtn-dashboard" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all bg-indigo-600 text-white shadow-lg shadow-indigo-900/20">
                    <i class="fa-solid fa-chart-pie w-5 text-center"></i> 통합 현황판
                </button>
                <button onclick="window.switchMenu('issues')" id="menuBtn-issues" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-white/5 transition-all">
                    <i class="fa-solid fa-clipboard-list w-5 text-center"></i> 문제 / 이슈 관리
                </button>
                
                <!-- 관리자 전용 메뉴 영역 -->
                <div id="admin-menus" class="pt-4 mt-4 border-t border-white/10 space-y-1.5 hidden">
                    <p class="px-4 text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">관리자 설정 (1~3단계)</p>
                    
                    <button onclick="window.switchMenu('sites')" id="menuBtn-sites" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-white/5 transition-all hidden">
                        <i class="fa-solid fa-network-wired w-5 text-center"></i> 사업장(건물) 관리
                    </button>
                    <button onclick="window.switchMenu('users')" id="menuBtn-users" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-white/5 transition-all hidden">
                        <i class="fa-solid fa-users-gear w-5 text-center"></i> 사용자 및 권한 관리
                    </button>
                    <button onclick="window.switchMenu('categories')" id="menuBtn-categories" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-white/5 transition-all hidden">
                        <i class="fa-solid fa-tags w-5 text-center"></i> 시스템 카테고리 (1단계전용)
                    </button>
                </div>
            </nav>

            <div class="p-4 border-t border-white/10">
                <button onclick="window.logout()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg text-sm font-medium text-red-400 hover:bg-red-500/10 transition-colors border border-red-500/20">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> 시스템 로그아웃
                </button>
            </div>
        </aside>

        <!-- 메인 콘텐츠 영역 -->
        <main class="flex-1 flex flex-col h-full relative overflow-hidden bg-[radial-gradient(ellipse_at_top_right,rgba(30,64,175,0.15),transparent_50%)]">
            
            <header class="glass-panel border-b border-white/10 px-6 py-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 z-30">
                <div>
                    <h2 id="pageTitle" class="text-xl font-bold text-white tracking-tight">통합 현황 대시보드</h2>
                    <p id="pageDesc" class="text-xs text-slate-400 mt-1">시스템 전체 등록 요약 현황입니다.</p>
                </div>
                <div class="flex items-center gap-3 w-full sm:w-auto">
                    <!-- 클라우드 실시간 동기화 상태 표시기 -->
                    <div class="flex flex-col items-end mr-2">
                        <div class="flex items-center gap-2" title="데이터베이스 실시간 연결 상태">
                            <span class="relative flex h-2.5 w-2.5">
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-blue-500"></span>
                            </span>
                            <span class="text-xs font-semibold text-blue-400">Cloud DB 실시간 동기화 중</span>
                        </div>
                        <span class="text-[9px] text-slate-500 mt-0.5">모든 데이터 변경 시 즉시 반영</span>
                    </div>

                    <!-- 백업용 구글 링크 -->
                    <button onclick="window.openGoogleDriveFolder()" class="flex-1 sm:flex-none px-4 py-2 bg-slate-800 border border-slate-600 rounded-lg hover:bg-slate-700 text-slate-300 transition-all text-sm font-medium flex items-center justify-center gap-2">
                        <i class="fa-brands fa-google-drive"></i> 드라이브
                    </button>
                    <button onclick="window.openGoogleSpreadsheet()" class="flex-1 sm:flex-none px-4 py-2 bg-slate-800 border border-slate-600 rounded-lg hover:bg-slate-700 text-slate-300 transition-all text-sm font-medium flex items-center justify-center gap-2">
                        <i class="fa-solid fa-file-excel"></i> 데이터 시트
                    </button>
                </div>
            </header>

            <div id="mainContent" class="flex-1 overflow-y-auto p-4 sm:p-6 z-20">
                <!-- 자바스크립트로 렌더링 됨 -->
            </div>
        </main>
    </div>

    <!-- 글로벌 오버레이 모달 (이슈 등록/수정, 사용자 수정 등) -->
    <div id="globalModal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
        <div class="glass-panel rounded-2xl w-full max-w-lg overflow-hidden border border-white/20 shadow-2xl transform transition-all">
            <div class="p-5 border-b border-white/10 flex justify-between items-center bg-white/5">
                <h3 id="modalTitle" class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-indigo-400"></i> <span id="modalTitleText">모달 제목</span>
                </h3>
                <button onclick="window.closeModal()" class="text-slate-400 hover:text-white transition bg-white/5 hover:bg-white/10 w-8 h-8 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="modalBody" class="p-6">
                <!-- 내용 동적 주입 -->
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 환경 변수 설정
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'sys-hq-portal';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        const GEMINI_API_KEY = "AIzaSyACPakmtFZWBRywxV_QN958ucbEIjIhgcQ"; // 향후 AI 확장을 위한 보존

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // 앱 상태 (메모리)
        let sites = [];
        let categories = [];
        let users = [];
        let issues = [];
        
        let currentUser = null; // 현재 로그인한 유저 객체
        let currentMenu = 'dashboard';
        let isDataLoaded = { sites: false, categories: false, users: false, issues: false };

        // Firebase 경로 헬퍼
        const getColRef = (colName) => collection(db, 'artifacts', appId, 'public', 'data', colName);
        const getDocRef = (colName, docId) => doc(db, 'artifacts', appId, 'public', 'data', colName, docId);

        // 자체 알림(Toast) 시스템
        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let icon = '<i class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>';
            let bgClass = 'bg-slate-800/90 border-emerald-500/30';
            
            if (type === 'error') {
                icon = '<i class="fa-solid fa-circle-exclamation text-red-400 text-lg"></i>';
                bgClass = 'bg-slate-800/90 border-red-500/30';
            } else if (type === 'info') {
                icon = '<i class="fa-solid fa-bell text-blue-400 text-lg"></i>';
                bgClass = 'bg-slate-800/90 border-blue-500/30';
            }

            toast.className = `toast-enter flex items-center gap-3 px-5 py-4 rounded-xl border backdrop-blur-md shadow-2xl text-sm font-medium text-white ${bgClass} max-w-sm pointer-events-auto`;
            toast.innerHTML = `${icon} <span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.replace('toast-enter', 'toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        function showLoader(show) {
            document.getElementById('global-loader').style.display = show ? 'flex' : 'none';
        }

        // --- STREAMING_CHUNK:Firebase 초기화 및 리스너 등록... ---
        async function initFirebase() {
            try {
                if (initialToken) {
                    await signInWithCustomToken(auth, initialToken);
                } else {
                    await signInAnonymously(auth);
                }
                console.log("Firebase Auth Success. UID:", auth.currentUser.uid);
                setupRealtimeListeners();
            } catch (error) {
                console.error("Firebase Auth Error:", error);
                window.showToast("서버 연결에 실패했습니다.", "error");
            }
        }

        function setupRealtimeListeners() {
            if (!auth.currentUser) return;
            showLoader(true);

            const errHandler = (err) => console.error("Snapshot error:", err);

            // Sites Listener
            onSnapshot(getColRef('sites'), (snapshot) => {
                const newData = [];
                snapshot.forEach(doc => newData.push({ id: doc.id, ...doc.data() }));
                sites = newData;
                if(newData.length === 0) seedInitialSites(); // 초기 데이터
                checkAllLoaded('sites');
            }, errHandler);

            // Categories Listener
            onSnapshot(getColRef('categories'), (snapshot) => {
                const newData = [];
                snapshot.forEach(doc => newData.push({ id: doc.id, ...doc.data() }));
                categories = newData;
                if(newData.length === 0) seedInitialCategories();
                checkAllLoaded('categories');
            }, errHandler);

            // Users Listener
            onSnapshot(getColRef('users'), (snapshot) => {
                const newData = [];
                snapshot.forEach(doc => newData.push({ id: doc.id, ...doc.data() }));
                users = newData;
                if(newData.length === 0) seedInitialUsers();
                checkAllLoaded('users');
            }, errHandler);

            // Issues Listener
            onSnapshot(getColRef('issues'), (snapshot) => {
                const newData = [];
                snapshot.forEach(doc => newData.push({ id: doc.id, ...doc.data() }));
                issues = newData;
                checkAllLoaded('issues');
            }, errHandler);
        }

        // 초기 데이터 세팅 (컬렉션이 비어있을 때 한 번 실행)
        async function seedInitialSites() {
            const defSites = [{ id: 's1', name: '본사 타워 (서울)' }, { id: 's2', name: '제1공장 (경기)' }];
            for(let s of defSites) await setDoc(getDocRef('sites', s.id), s);
        }
        async function seedInitialCategories() {
            const defCats = [{ id: 'c1', name: '시설물/인프라' }, { id: 'c2', name: 'IT/네트워크' }, { id: 'c3', name: '기타 민원' }];
            for(let c of defCats) await setDoc(getDocRef('categories', c.id), c);
        }
        async function seedInitialUsers() {
            const master = { id: 'master01', pwd: '123', name: '김최고 (마스터)', phone: '010-1111-1111', role: 1, site: '전체' };
            await setDoc(getDocRef('users', master.id), master);
        }

        // 데이터 로드 완료 체크 및 화면 갱신
        function checkAllLoaded(type) {
            isDataLoaded[type] = true;
            if (isDataLoaded.sites && isDataLoaded.categories && isDataLoaded.users && isDataLoaded.issues) {
                showLoader(false);
                // 로그인 유지 확인
                const savedUid = sessionStorage.getItem('sys_logged_in_uid');
                if (savedUid && !currentUser) {
                    const user = users.find(u => u.id === savedUid);
                    if (user) {
                        currentUser = user;
                        finalizeLogin();
                    }
                }
                
                // 이미 로그인된 상태라면 화면 리렌더링 (실시간 갱신 효과)
                if (currentUser) {
                    if(document.getElementById('globalModal').classList.contains('hidden')) {
                        window.switchMenu(currentMenu);
                    }
                }
            }
        }

        // --- STREAMING_CHUNK:인증 로직 (로그인/회원가입)... ---
        window.toggleAuthMode = function(mode) {
            document.getElementById('loginView').classList.toggle('hidden', mode === 'signup');
            document.getElementById('signupView').classList.toggle('hidden', mode === 'login');
        };

        window.handleLoginSubmit = function(e) {
            e.preventDefault();
            const id = document.getElementById('loginId').value.trim();
            const pwd = document.getElementById('loginPwd').value.trim();
            const btn = document.getElementById('btnLogin');
            const btnText = document.getElementById('btnLoginText');

            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            btnText.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> 클라우드 DB 대조 중...';

            // 실시간 DB 대조 시뮬레이션을 위한 지연
            setTimeout(() => {
                const user = users.find(u => u.id === id && u.pwd === pwd);
                if (user) {
                    currentUser = user;
                    sessionStorage.setItem('sys_logged_in_uid', user.id);
                    finalizeLogin();
                    window.showToast(`${currentUser.name}님 환영합니다. (클라우드 동기화 완료)`, 'success');
                } else {
                    window.showToast('아이디 또는 비밀번호가 일치하지 않습니다.', 'error');
                }
                btn.disabled = false;
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
                btnText.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> 시스템 접속 (DB 검증)';
            }, 800);
        };

        window.handleSignupSubmit = async function(e) {
            e.preventDefault();
            if(!auth.currentUser) return window.showToast('클라우드 연결 중입니다. 잠시 후 시도하세요.', 'error');

            const id = document.getElementById('regId').value.trim();
            const name = document.getElementById('regName').value.trim();
            const pwd = document.getElementById('regPwd').value.trim();
            const phone = document.getElementById('regPhone').value.trim();

            if (users.some(u => u.id === id)) {
                return window.showToast('이미 존재하는 아이디입니다.', 'error');
            }

            const newUser = {
                id: id, pwd: pwd, name: name, phone: phone,
                role: 4, site: '미지정'
            };

            showLoader(true);
            try {
                // Firebase DB 저장 (저장 시 onSnapshot 이 반응하여 자동 업데이트)
                await setDoc(getDocRef('users', id), newUser);
                window.showToast('가입 신청 완료! 실시간 DB에 등록되었습니다.', 'success');
                window.toggleAuthMode('login');
                document.getElementById('loginId').value = id;
                document.getElementById('loginPwd').value = '';
            } catch(e) {
                window.showToast('데이터 저장 실패', 'error');
            } finally {
                showLoader(false);
            }
        };

        window.logout = function() {
            currentUser = null;
            sessionStorage.removeItem('sys_logged_in_uid');
            location.reload();
        };

        function finalizeLogin() {
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('app-container').classList.add('flex');
            
            document.getElementById('navUserName').textContent = currentUser.name;
            let roleStr = currentUser.role === 1 ? '1단계 (최고관리자)' : currentUser.role === 2 ? '2단계 (글로벌 뷰어)' : currentUser.role === 3 ? '3단계 (사업장 관리)' : '일반 사용자';
            document.getElementById('navUserRole').textContent = roleStr;
            document.getElementById('navUserSite').textContent = currentUser.site;

            // 일반 사용자 메뉴 격리 처리
            const adminMenuArea = document.getElementById('admin-menus');
            if (currentUser.role === 4) {
                adminMenuArea.classList.add('hidden'); // 완전 숨김
            } else {
                adminMenuArea.classList.remove('hidden');
                document.getElementById('menuBtn-users').classList.toggle('hidden', currentUser.role !== 1);
                document.getElementById('menuBtn-sites').classList.toggle('hidden', currentUser.role > 2);
                document.getElementById('menuBtn-categories').classList.toggle('hidden', currentUser.role !== 1);
            }

            window.switchMenu('dashboard');
        }

        // --- STREAMING_CHUNK:메인 화면 렌더링 및 클라우드 액션... ---
        window.switchMenu = function(menu) {
            currentMenu = menu;
            document.querySelectorAll('nav button').forEach(btn => {
                if(!btn.id.includes('menuBtn')) return;
                btn.className = btn.className.replace('bg-indigo-600 text-white shadow-lg shadow-indigo-900/20', 'text-slate-400 hover:text-white hover:bg-white/5');
            });
            const activeBtn = document.getElementById(`menuBtn-${menu}`);
            if(activeBtn) {
                activeBtn.className = activeBtn.className.replace('text-slate-400 hover:text-white hover:bg-white/5', 'bg-indigo-600 text-white shadow-lg shadow-indigo-900/20');
            }

            const titleEl = document.getElementById('pageTitle');
            const descEl = document.getElementById('pageDesc');
            
            if (menu === 'dashboard') {
                titleEl.textContent = '통합 현황판'; descEl.textContent = '시스템 전체 등록 요약'; renderDashboard();
            } else if (menu === 'issues') {
                titleEl.textContent = '문제 / 이슈 관리'; descEl.textContent = '사업장별 발생 이슈 클라우드 관리'; renderIssues();
            } else if (menu === 'users') {
                titleEl.textContent = '사용자 및 권한 관리'; descEl.textContent = '계정 제어 및 사업장 배정 (1단계 전용)'; renderUsers();
            } else if (menu === 'sites' || menu === 'categories') {
                titleEl.textContent = menu === 'sites' ? '사업장 관리' : '카테고리 관리'; 
                descEl.textContent = '기본 메타 데이터 관리'; 
                document.getElementById('mainContent').innerHTML = `<div class="p-6 text-center text-slate-500">현재 클라우드 DB에 연동되어 자동 관리됩니다.</div>`;
            }
        };

        window.saveIssue = async function(e, id) {
            e.preventDefault();
            if(!auth.currentUser) return;
            showLoader(true);

            const siteVal = currentUser.role >= 3 ? currentUser.site : document.getElementById('issSite').value;
            const isNew = !id;
            const issueId = isNew ? 'iss_' + Date.now() : id;
            
            const newDate = new Date().toLocaleString('ko-KR');
            let data = {
                id: issueId,
                site: siteVal,
                category: document.getElementById('issCat').value,
                content: document.getElementById('issContent').value,
                status: document.getElementById('issStatus').value,
            };

            if (isNew) {
                data.regDate = newDate;
                data.completeDate = data.status === '완료' ? newDate : '';
                data.duration = '-';
            } else {
                const target = issues.find(i => i.id === id);
                data.regDate = target.regDate;
                if (target.status !== '완료' && data.status === '완료') {
                    data.completeDate = newDate;
                } else if (data.status !== '완료') {
                    data.completeDate = '';
                } else {
                    data.completeDate = target.completeDate;
                }
                data.duration = target.duration;
            }

            try {
                await setDoc(getDocRef('issues', issueId), data);
                window.showToast(isNew ? '신규 이슈가 클라우드에 등록되었습니다.' : '수정 내역이 클라우드에 반영되었습니다.');
                window.closeModal();
            } catch (err) {
                window.showToast('저장 실패', 'error');
            } finally {
                showLoader(false);
            }
        };

            if (currentUser.role !== 1) return;
            if (confirm("정말 이 데이터를 삭제하시겠습니까? (복구 불가)")) {
                try {
                    await deleteDoc(getDocRef('issues', id));
                    window.showToast('데이터가 클라우드에서 영구 삭제되었습니다.', 'info');
                } catch(e) { window.showToast('삭제 실패', 'error'); }
            }
        };

        window.saveUser = async function(e, oldId) {
            e.preventDefault();
            const target = users.find(u => u.id === oldId);
            if (!target) return;

            const newId = document.getElementById('editUid').value.trim();
            if (newId !== oldId && users.some(u => u.id === newId)) return window.showToast('이미 존재하는 아이디입니다.', 'error');

            const updatedData = {
                id: newId,
                name: target.name,
                pwd: document.getElementById('editUpwd').value.trim() || target.pwd,
                phone: document.getElementById('editUphone').value,
                role: parseInt(document.getElementById('editUrole').value),
                site: document.getElementById('editUsite').value
            };

            showLoader(true);
            try {
                if (newId !== oldId) await deleteDoc(getDocRef('users', oldId)); // 아이디가 바뀌면 기존 문서 삭제
                await setDoc(getDocRef('users', newId), updatedData);
                window.showToast(`사용자 [${target.name}] 정보가 클라우드에 업데이트 되었습니다.`);
                window.closeModal();
            } catch(err) { window.showToast('저장 실패', 'error'); }
            finally { showLoader(false); }
        };

        // --- 외부 링크 오픈 (기존 백업용) ---
        window.openGoogleSpreadsheet = function() {
            window.open("https://docs.google.com/spreadsheets/d/1sKPXRGUPDjxM_t-7-I8E_NgSflaw5sE3NjPk2LjEL_0/edit?usp=sharing", '_blank');
        };
        window.openGoogleDriveFolder = function() {
            window.open("https://drive.google.com/drive/folders/1Ac8NUrAhZdb3lVJ_EGaZS9Ary3pLhHJc?usp=sharing", '_blank');
        };

        // 부팅 시 실행
        initFirebase();

    </script>
</body>
</html>
